<!doctype html>
<html lang="bs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f2ee"><title>Tržište uživo</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/player.css">
</head><body class="player">
<header class="phone-head"><a class="wordmark" href="/">Tržište uživo</a><span id="connection" class="subtle" role="status">Povezivanje…</span></header>
<main class="phone-main"><section id="joinScreen" class="join-screen">
<div class="join-symbol" aria-hidden="true"><span></span><span></span><span></span></div>
<h1>Tvoja firma.<br>Tvoja samostalnost.</h1><p>Pronađi partnera. Pregovaraj o udjelu. Razmisli kome prepuštaš kontrolu.</p>
<form id="joinForm"><div class="person-fields"><div><label for="firstNameInput">Ime</label><input id="firstNameInput" name="given-name" maxlength="40" autocomplete="given-name" required></div><div><label for="lastNameInput">Prezime</label><input id="lastNameInput" name="family-name" maxlength="40" autocomplete="family-name" required></div></div><label for="nameInput">Kako se zove tvoja firma?</label><input id="nameInput" maxlength="24" autocomplete="organization" placeholder="npr. Brzi net" required><button class="btn primary full" id="joinBtn">Uđi na tržište</button></form>
<p class="subtle join-foot">Ime i prezime se prikazuju uz firmu kako biste se lakše pronašli tokom pregovora.</p></section>
<section id="app" class="hidden"><div id="identity" class="identity"></div><div id="stage"></div></section>
<p id="error" class="error hidden" role="alert"></p></main>
<script src="/common.js"></script><script src="/lesson.js"></script><script src="/player.js"></script></body></html>
