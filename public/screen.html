<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tržište uživo · projektor</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/screen.css">
</head>
<body class="screen">
<header class="screen-head"><a class="wordmark" href="/screen">Tržište uživo</a><nav id="journey" aria-label="Tok igre"></nav><span id="phaseLabel"></span></header>
<main id="scene" class="scene"></main>
<footer class="presenter" id="presenter"><div class="presenter-tools">
<details id="controls"><summary>Kontrole</summary><div class="control-menu">
<button class="btn" id="bots">+8 demo firmi</button><button class="btn" id="removeBots">Ukloni demo firme</button>
<button class="btn" id="reset">Nova igra · iste firme</button><button class="btn" id="clear">Isprazni salu</button>
<button class="btn" id="fullscreen">Cijeli ekran</button><button class="btn" id="hide">Sakrij kontrole · A</button>
<label>PIN domaćina<input id="pin" type="password" autocomplete="off" placeholder="Ako je podešen"></label>
</div></details><button class="btn quiet" id="pause">Pauziraj</button><span id="progress" class="subtle"></span></div>
<div class="presenter-next"><span id="timing" class="subtle"></span><button class="btn primary" id="next">Pokreni igru</button></div></footer>
<button class="btn restore hidden" id="restore">Prikaži kontrole · A</button><div id="notice" class="notice hidden" role="status"></div>
<script src="/common.js"></script><script src="/lesson.js"></script><script src="/screen.js"></script></body></html>
